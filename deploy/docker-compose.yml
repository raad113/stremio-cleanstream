# CleanStream production setup. Runs separately from anything else on the
# server: its own project name, network, volumes and folder.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build                    # if nginx/Apache already serves ports 80/443
#   docker compose --profile caddy up -d --build    # if ports 80/443 are free (Caddy adds HTTPS)
#
# The database and Redis have no public ports. The app listens only on
# 127.0.0.1, so it is reachable from the internet only through Caddy or nginx.

name: cleanstream

services:
  cleanstream:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "7000"
      TRUST_PROXY: "1"
      CLEANSTREAM_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      DATABASE_URL: postgresql://cleanstream:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/cleanstream
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${CLEANSTREAM_PORT:-7000}:7000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleanstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cleanstream
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web server with automatic HTTPS (Let's Encrypt). Only start it
  # when nothing else on the server uses ports 80 and 443.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cleanstream

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
