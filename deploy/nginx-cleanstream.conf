# Use this only if nginx already runs on the server (for your other site).
# 1. Replace cleanstream.example.com with your domain (2 places).
# 2. Copy to /etc/nginx/sites-available/cleanstream and enable it:
#      sudo ln -s /etc/nginx/sites-available/cleanstream /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 3. Add HTTPS:  sudo certbot --nginx -d cleanstream.example.com
# This file is separate from your other site's configuration; nothing else changes.

server {
    listen 80;
    server_name cleanstream.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
